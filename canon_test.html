<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Canon G610 V4</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    
    <style>
        body { background-color: #f8fafc; }
        .printer-card { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;
        const CANON_IP = "http://10.1.104.142";

        const Icons = {
            Check: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Alert: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            WifiOff: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/></svg>,
            Refresh: ({spin}) => <svg className={spin ? "animate-spin" : ""} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        };

        // --- COMPONENTE DE BARRA DE TINTA ---
        function InkBar({ label, color, value }) {
            const isError = value === -1;
            
            return (
                <div className="flex items-center gap-2 mb-2">
                    <div className="w-6 text-[10px] font-bold text-slate-500 text-right">{label}</div>
                    <div className="flex-grow h-4 bg-slate-100 rounded-md overflow-hidden relative border border-slate-200 shadow-inner group">
                        {!isError && (
                            <div className={`h-full transition-all duration-1000 ${color}`} style={{ width: `${value}%` }}></div>
                        )}
                        <div className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-slate-700 drop-shadow-sm group-hover:hidden">
                            {isError ? '--' : `${value}%`}
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard() {
            const [status, setStatus] = useState("loading");
            const [message, setMessage] = useState("Conectando...");
            const [ink, setInk] = useState({ gy: -1, bk: -1, r: -1, c: -1, m: -1, y: -1 });
            const [debugText, setDebugText] = useState("");

            const fetchCanon = async () => {
                setStatus("loading");
                setMessage("Consultando model.js...");
                setDebugText("");
                
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);
                    
                    // Extraemos directamente el JS con la data
                    const res = await fetch(CANON_IP + "/JS_MDL/model.js", { signal: controller.signal, cache: "no-store", credentials: "omit" });
                    const jsText = await res.text();
                    clearTimeout(timeoutId);

                    setDebugText("Archivo model.js descargado exitosamente. Analizando inktank[]...");

                    // Función para convertir la escala interna de Canon (0-4) a porcentaje
                    const levelToPct = (lvl) => {
                        const l = parseInt(lvl);
                        if (l >= 4) return 100; // Lleno
                        if (l === 3) return 75;  // Alto
                        if (l === 2) return 50;  // Medio
                        if (l === 1) return 20;  // Bajo (Tóner bajo)
                        if (l === 0) return 0;   // Vacío
                        return -1;
                    };

                    // Función para extraer el valor exacto usando Expresiones Regulares
                    const getInk = (index) => {
                        // Busca el patrón inktank[0]=[x, Y, z] donde Y es el nivel
                        const regex = new RegExp(`inktank\\[${index}\\]=\\[\\d+,(\\d+),\\d+\\]`);
                        const match = jsText.match(regex);
                        return match ? levelToPct(match[1]) : -1;
                    };

                    const newInk = {
                        gy: getInk(0), // Gris
                        bk: getInk(1), // Negro
                        r: getInk(2),  // Rojo
                        c: getInk(3),  // Cian
                        m: getInk(4),  // Magenta
                        y: getInk(5)   // Amarillo
                    };

                    setInk(newInk);
                    
                    // Validar si hay alertas
                    const hasZero = Object.values(newInk).some(val => val === 0);
                    const hasLow = Object.values(newInk).some(val => val > 0 && val <= 20);

                    if (hasZero) {
                        setStatus("warning");
                        setMessage("Cambio de Tóner Requerido");
                    } else if (hasLow) {
                        setStatus("warning");
                        setMessage("Nivel de Tinta Bajo");
                    } else {
                        setStatus("online");
                        setMessage("Operativa");
                    }

                } catch (err) {
                    setStatus("offline");
                    setMessage("Sin conexión al equipo");
                    setDebugText(`Error: ${err.message}\nAsegúrate de estar en la red del banco.`);
                }
            };

            useEffect(() => {
                fetchCanon();
            }, []);

            return (
                <div className="min-h-screen p-8 flex flex-col items-center justify-center gap-8">
                    <div className="w-full max-w-md">
                        <div className={`printer-card bg-white rounded-2xl border-l-[6px] p-6 flex flex-col justify-between shadow-lg ${status === 'online' ? 'border-green-500' : status === 'warning' ? 'border-yellow-400' : status === 'error' ? 'border-red-500' : 'border-slate-300'}`}>
                            <div>
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h2 className="font-bold text-lg text-slate-800">Impresora Comercial Canon</h2>
                                        <div className="text-xs font-mono text-slate-500 mt-1 uppercase tracking-wider">CANON PIXMA G610</div>
                                    </div>
                                    <span className={`px-2 py-1 rounded-lg text-[10px] font-bold uppercase ${status === 'online' ? 'bg-green-100 text-green-700' : status === 'warning' ? 'bg-yellow-100 text-yellow-700' : 'bg-slate-100 text-slate-500'}`}>
                                        {status === 'loading' ? '...' : status}
                                    </span>
                                </div>
                                
                                <div className="bg-slate-50 rounded-xl p-3 mb-5 flex items-center gap-3 text-sm font-medium text-slate-700 border border-slate-100">
                                    {status === 'online' ? <span className="text-green-500"><Icons.Check /></span> : status === 'warning' ? <span className="text-yellow-500"><Icons.Alert /></span> : <span className="text-slate-400"><Icons.WifiOff /></span>}
                                    <span>{message}</span>
                                </div>

                                <div className="mb-4">
                                    <div className="flex justify-between items-end mb-3">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Niveles Estimados</span>
                                    </div>
                                    {status !== 'offline' ? (
                                        <div className="space-y-1">
                                            <InkBar label="GY" color="bg-gray-400" value={ink.gy} />
                                            <InkBar label="BK" color="bg-slate-800" value={ink.bk} />
                                            <InkBar label="R" color="bg-red-500" value={ink.r} />
                                            <InkBar label="C" color="bg-cyan-500" value={ink.c} />
                                            <InkBar label="M" color="bg-pink-500" value={ink.m} />
                                            <InkBar label="Y" color="bg-yellow-400" value={ink.y} />
                                        </div>
                                    ) : (
                                        <div className="h-32 flex flex-col items-center justify-center text-slate-300 gap-2 border-2 border-dashed border-slate-100 rounded-xl">
                                            <Icons.WifiOff />
                                            <span className="text-xs">Desconectado</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                            
                            <div className="mt-4 pt-4 border-t border-slate-100">
                                <button onClick={fetchCanon} disabled={status === 'loading'} className="w-full bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold text-center text-sm py-3 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50">
                                    <Icons.Refresh spin={status === 'loading'} /> 
                                    {status === 'loading' ? 'Leyendo API Canon...' : 'Actualizar Niveles'}
                                </button>
                                
                                <div className="mt-4 text-center">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">IP de Red</span>
                                    <span className="text-sm font-bold text-blue-600 font-mono bg-blue-50 px-2 py-0.5 rounded">{CANON_IP.replace("http://", "")}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
